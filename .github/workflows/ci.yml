name: ci

# Fair-play gate + data-free Python tests. No dataset, no GPU.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fair-play gate — no network / LLM / geocoding clients in the pipeline
        run: |
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|urllib|aiohttp|openai|anthropic|google\.generativeai|googlemaps|geopy)\b' src/; then
            echo "external lookups are forbidden by the challenge rules (DATA_SECURITY_AND_LEAKAGE.md §1)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: python -m pip install -q "pandas>=2.2,<3" "numpy<2.2" polars pyarrow rapidfuzz scipy scikit-learn anyascii lightgbm

      - name: Data-free tests
        run: |
          python tests/test_runlog.py
          python tests/test_decide.py
          python tests/test_features_v2.py
          python tests/test_review_fixes.py
          python tests/test_v4_contention.py
          # test_chunk_equiv.py needs the dataset; test_embed_knn.py needs torch
