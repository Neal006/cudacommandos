[package]
name = "mlguard"
version = "0.1.0"
edition = "2021"
description = "Trust checks for the entity-resolution pipeline: overfitting, leakage, drift, submission validity."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
